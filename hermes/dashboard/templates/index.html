<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e0e0e0; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #c9a0ff; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; color: #88b4e7; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { padding: 0.4rem 1rem; border: 1px solid #333; border-radius: 6px; cursor: pointer; background: #1a1d27; color: #aaa; font-size: 0.85rem; }
    .tab.active { background: #2a2d3a; color: #fff; border-color: #555; }
    .card { background: #1a1d27; border-radius: 8px; padding: 1rem; margin-bottom: 0.6rem; border: 1px solid #262933; }
    .card .meta { font-size: 0.75rem; color: #777; margin-bottom: 0.3rem; }
    .card .body { font-size: 0.88rem; line-height: 1.4; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
    .badge.pending { background: #3a3000; color: #ffd54f; }
    .badge.approved { background: #003a1a; color: #69f0ae; }
    .badge.rejected { background: #3a0000; color: #ff5252; }
    .badge.posted { background: #002a3a; color: #40c4ff; }
    .badge.posted_dry_run { background: #2a2a00; color: #e0e040; }
    .badge.dry_run { background: #2a2a00; color: #e0e040; }
    .badge.x { background: #1a1a1a; color: #fff; }
    .badge.linkedin { background: #003366; color: #70b5f9; }
    .badge.instagram { background: #3a002a; color: #f77fbe; }
    .actions { margin-top: 0.5rem; display: flex; gap: 0.4rem; }
    .btn { padding: 0.3rem 0.7rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-approve { background: #2e7d32; color: #fff; }
    .btn-reject { background: #c62828; color: #fff; }
    .btn:hover { opacity: 0.85; }
    #content { min-height: 200px; }
    .empty { color: #555; font-style: italic; padding: 2rem; text-align: center; }
    a { color: #88b4e7; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .kw { display: inline-block; padding: 0.1rem 0.4rem; margin: 0.1rem; background: #2a2d3a; border-radius: 3px; font-size: 0.7rem; color: #c9a0ff; }
  </style>
</head>
<body>
  <h1>Hermes Dashboard</h1>
  <div class="tabs">
    <div class="tab active" data-tab="mentions">Mentions</div>
    <div class="tab" data-tab="drafts">Drafts</div>
    <div class="tab" data-tab="posts">Posts</div>
    <div class="tab" data-tab="runs">Runs</div>
  </div>
  <div id="content"></div>
<script>
  let currentTab = 'mentions';

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      loadTab();
    });
  });

  async function api(path) {
    const r = await fetch(path);
    return r.json();
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  async function loadTab() {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="empty">Loading...</div>';
    try {
      if (currentTab === 'mentions') {
        const data = await api('/api/mentions');
        if (!data.length) { el.innerHTML = '<div class="empty">No mentions yet</div>'; return; }
        el.innerHTML = data.map(m => `
          <div class="card">
            <div class="meta">
              <span class="badge ${esc(m.platform)}">${esc(m.platform)}</span>
              ${m.author ? `<strong>@${esc(m.author)}</strong>` : ''}
              &middot; ${esc(m.seen_at)}
              ${m.url ? ` &middot; <a href="${esc(m.url)}" target="_blank">link</a>` : ''}
            </div>
            <div class="body">${esc(m.text)}</div>
            <div>${(m.matched_keywords || []).map(k => `<span class="kw">${esc(k)}</span>`).join('')}</div>
          </div>
        `).join('');
      } else if (currentTab === 'drafts') {
        const data = await api('/api/drafts');
        if (!data.length) { el.innerHTML = '<div class="empty">No drafts yet</div>'; return; }
        el.innerHTML = data.map(d => `
          <div class="card">
            <div class="meta">
              <span class="badge ${esc(d.platform)}">${esc(d.platform)}</span>
              <span class="badge ${esc(d.status)}">${esc(d.status)}</span>
              &middot; topic: <strong>${esc(d.topic)}</strong>
              &middot; ${esc(d.created_at)}
            </div>
            <div class="body">${esc(d.body)}</div>
            ${d.status === 'pending' ? `
              <div class="actions">
                <button class="btn btn-approve" onclick="act(${d.id},'approve')">Approve</button>
                <button class="btn btn-reject" onclick="act(${d.id},'reject')">Reject</button>
              </div>
            ` : ''}
          </div>
        `).join('');
      } else if (currentTab === 'posts') {
        const data = await api('/api/posts');
        if (!data.length) { el.innerHTML = '<div class="empty">No posts yet</div>'; return; }
        el.innerHTML = data.map(p => `
          <div class="card">
            <div class="meta">
              <span class="badge ${esc(p.platform)}">${esc(p.platform)}</span>
              ${p.dry_run ? '<span class="badge dry_run">DRY RUN</span>' : '<span class="badge posted">LIVE</span>'}
              &middot; ${esc(p.posted_at)}
              ${p.url ? ` &middot; <a href="${esc(p.url)}" target="_blank">view</a>` : ''}
              ${p.error ? ` &middot; <span style="color:#ff5252">error: ${esc(p.error)}</span>` : ''}
            </div>
            <div class="body">${esc(p.body)}</div>
          </div>
        `).join('');
      } else if (currentTab === 'runs') {
        const data = await api('/api/runs');
        if (!data.length) { el.innerHTML = '<div class="empty">No runs yet</div>'; return; }
        el.innerHTML = data.map(r => `
          <div class="card">
            <div class="meta">
              <strong>${esc(r.job)}</strong>
              &middot; ${r.ok ? '&#9989;' : '&#10060;'}
              &middot; ${esc(r.started_at)} &rarr; ${esc(r.finished_at || '...')}
            </div>
            <div class="body">${esc(r.detail)}</div>
          </div>
        `).join('');
      }
    } catch(e) {
      el.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
    }
  }

  async function act(id, action) {
    await fetch(`/api/drafts/${id}/${action}`, { method: 'POST' });
    loadTab();
  }

  loadTab();
  setInterval(loadTab, 15000);
</script>
</body>
</html>
